name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start Wiki.js dev stand
        run: docker compose -f deploy/docker-compose.dev.yml up -d db wiki
      - name: Seed fixture ACL
        run: node deploy/seed/seed.mjs
      - name: Run e2e tests
        run: npm run e2e
      - name: Teardown
        if: always()
        run: docker compose -f deploy/docker-compose.dev.yml down -v
