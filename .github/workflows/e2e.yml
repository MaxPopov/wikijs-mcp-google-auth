name: e2e

# Heavy docker-based integration e2e (Wiki.js + delegation + MCP tools).
# Runs only on pushes to dev/main — i.e. before/at merge — not on every PR.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # No --wait on wiki: its Docker healthcheck is unreliable on CI
      # runners. seed (run.mjs) polls Wiki.js over HTTP itself and is the
      # real readiness gate.
      - name: Start Wiki.js dev stand
        run: docker compose -f deploy/docker-compose.dev.yml up -d db wiki
      - name: Seed fixture ACL
        run: node deploy/seed/run.mjs
      - name: Verify seed produced the assertion key
        run: test -f deploy/keys/mcp-assertion-key.pem
      - name: Run e2e tests
        run: npm run e2e
      - name: Teardown
        if: always()
        run: docker compose -f deploy/docker-compose.dev.yml down -v
