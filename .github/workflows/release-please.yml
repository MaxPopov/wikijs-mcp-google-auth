name: Release please

# Computes the next version from Conventional Commits and keeps a release
# PR open against dev. Merging that PR bumps the version everywhere, writes
# CHANGELOG.md, and creates the vX.Y.Z tag + GitHub Release.
#
# The image is NOT built here — that happens on the dev -> main merge, in
# "Release on main". See CLAUDE.md for the full flow.
#
# Nothing to bump by hand: the version comes from commit prefixes
# (fix: -> patch, feat: -> minor, ! or BREAKING CHANGE -> major).

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write        # commit the bump, create the tag + Release
  pull-requests: write   # open and groom the release PR
  issues: write          # manage the autorelease:* labels it uses for bookkeeping

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          target-branch: dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
