name: Release on main

# Builds and publishes the image for whatever version dev brought in.
#
# The version, the CHANGELOG, the vX.Y.Z tag and the GitHub Release are all
# produced earlier, on dev, by "Release please" — this workflow only turns
# the released source into a published artifact.
#
# Each version is published exactly once: the run skips itself when that
# image tag is already in GHCR. Without that check a later push to main
# (a direct docs fix, a hotfix merge) would overwrite an already-published
# vX.Y.Z with different content.
#
# No PAT or external secret is needed — GITHUB_TOKEN is provided
# automatically to the run.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-on-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # push the image to GHCR (built-in token)

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and image name
        id: meta
        run: |
          v="$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # GHCR (Docker) requires the repository path to be lowercase, but
          # github.repository_owner keeps the account's original casing
          # (e.g. "MaxPopov"). Lowercase it so the image tag is valid.
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner_lc}/wikijs-mcp-server" >> "$GITHUB_OUTPUT"
          echo "Publishing v$v."

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this version is already published
        id: published
        run: |
          ref="${{ steps.meta.outputs.image }}:v${{ steps.meta.outputs.version }}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$ref is already published — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: steps.published.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/mcp-server/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:v${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
