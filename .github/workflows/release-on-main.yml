name: Release on main

# Fully automatic release: on every push to main, read the version from
# package.json and — if that vX.Y.Z tag does not exist yet — build & push
# the image AND create the git tag + GitHub Release in ONE run.
#
# Why one job: a tag/release created with the built-in GITHUB_TOKEN does
# NOT trigger other workflows (GitHub blocks recursive triggers), so a
# separate "build on tag" workflow would never fire. Doing everything here
# avoids that. No PAT / external secret is needed — GITHUB_TOKEN is
# provided automatically to the run.
#
# Contract: bump `version` in package.json before merging to main. If the
# version is unchanged (tag already exists), this run is a no-op.

on:
  push:
    branches: [main]

concurrency:
  group: release-on-main
  cancel-in-progress: false

permissions:
  contents: write   # create the tag + GitHub Release (built-in token)
  packages: write   # push the image to GHCR (built-in token)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version and check tag
        id: meta
        run: |
          v="$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # GHCR (Docker) requires the repository path to be lowercase, but
          # github.repository_owner keeps the account's original casing
          # (e.g. "MaxPopov"). Lowercase it so the image tag is valid.
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner_lc}/wikijs-mcp-server" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$v already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Releasing v$v."
          fi

      - name: Log in to GHCR
        if: steps.meta.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.meta.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/mcp-server/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:v${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

      # Creates the git tag at this commit AND the GitHub Release. Uses the
      # built-in GITHUB_TOKEN automatically (no token input needed).
      - name: Create tag and GitHub Release
        if: steps.meta.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.meta.outputs.version }}
          generate_release_notes: true
