name: Release on main

# Publishes the artifact for whatever version dev brought in.
#
# The version, the CHANGELOG, the vX.Y.Z tag and the GitHub Release are
# normally produced earlier, on dev, by "Release please". This workflow turns
# the released source into a published image, and carries a safety net: if
# that version has no tag yet, it creates the tag and Release itself.
#
# The safety net matters for a version release-please did not tag — the first
# release after adopting it, or a hand-set version. In the steady-state flow
# the tag already exists by the time dev reaches main and the step is skipped.
#
# Each version is published exactly once: the run skips the build when that
# image tag is already in GHCR. Without that check a later push to main (a
# direct docs fix, a hotfix merge) would overwrite an already-published
# vX.Y.Z with different content.
#
# No PAT or external secret is needed — GITHUB_TOKEN is provided
# automatically to the run.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-on-main
  cancel-in-progress: false

permissions:
  contents: write   # create the tag + GitHub Release when missing
  packages: write   # push the image to GHCR

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version and image name
        id: meta
        run: |
          v="$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # GHCR (Docker) requires the repository path to be lowercase, but
          # github.repository_owner keeps the account's original casing
          # (e.g. "MaxPopov"). Lowercase it so the image tag is valid.
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner_lc}/wikijs-mcp-server" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "v$v has no tag — this run will create it."
          fi
          echo "Publishing v$v."

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this version is already published
        id: published
        run: |
          ref="${{ steps.meta.outputs.image }}:v${{ steps.meta.outputs.version }}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$ref is already published — nothing to build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: steps.published.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/mcp-server/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:v${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

      # Runs AFTER the image so a Release never announces an artifact that
      # does not exist yet. Skipped when release-please already tagged it.
      - name: Create tag and GitHub Release if missing
        if: steps.meta.outputs.tagged == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.meta.outputs.version }}
          generate_release_notes: true
