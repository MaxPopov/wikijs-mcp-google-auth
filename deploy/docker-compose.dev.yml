# ISOLATED development/test stand. Never points at a production Wiki.js.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d db wiki
#   node deploy/seed/seed.mjs
#
# The MCP server itself runs on the host during development (npm run dev)
# or as the `mcp` service (profile "mcp") for full-stack testing.

name: wikijs-mcp-dev

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: wikijsrocks
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wikijs -d wiki']
      interval: 5s
      timeout: 3s
      retries: 20

  wiki:
    image: ghcr.io/requarks/wiki:2.5.303
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: wikijsrocks
      DB_NAME: wiki
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      # The custom delegation auth module, mounted into Wiki.js.
      # Directory name MUST match the module key in definition.yml.
      - ../packages/wikijs-auth-module:/wiki/server/modules/authentication/mcpdelegation:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60

  mcp:
    profiles: ['mcp']
    build:
      context: ..
      dockerfile: packages/mcp-server/Dockerfile
    depends_on:
      wiki:
        condition: service_healthy
    environment:
      PORT: 8000
      PUBLIC_URL: http://localhost:8000
      WIKIJS_URL: http://wiki:3000
      WIKIJS_STRATEGY_KEY: mcpdelegation
      MCP_ASSERTION_PRIVATE_KEY_FILE: /run/secrets/mcp-assertion-key
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-}
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./keys/mcp-assertion-key.pem:/run/secrets/mcp-assertion-key:ro

volumes:
  db-data:
