# PRODUCTION deployment: MCP server ONLY.
#
# Wiki.js is NOT deployed here — it already exists. The delegation auth
# module is installed on that existing Wiki.js instance separately
# (see packages/wikijs-auth-module/README.md).
#
# Usage:
#   1. Copy .env.example to .env next to this file and fill in values.
#   2. Put the MCP assertion private key at ./keys/mcp-assertion-key.pem
#   3. docker compose -f docker-compose.prod.yml up -d
#
# The image tag is produced by a tagged release from the `main` branch —
# never deploy an untagged/dev build to production.

name: wikijs-mcp

services:
  mcp:
    image: ${MCP_IMAGE:?Set MCP_IMAGE to a tagged release image}
    restart: unless-stopped
    environment:
      PORT: 8000
      PUBLIC_URL: ${PUBLIC_URL:?Public HTTPS URL of this MCP server}
      WIKIJS_URL: ${WIKIJS_URL:?Base URL of the existing Wiki.js instance}
      WIKIJS_STRATEGY_KEY: ${WIKIJS_STRATEGY_KEY:-mcpdelegation}
      MCP_ASSERTION_PRIVATE_KEY_FILE: /run/secrets/mcp-assertion-key
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?}
      GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:?Workspace domain, e.g. company.com}
      SESSION_STORE_FILE: /data/sessions.json
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./keys/mcp-assertion-key.pem:/run/secrets/mcp-assertion-key:ro
      - mcp-data:/data
    ports:
      # Expose only to the reverse proxy host; terminate TLS there.
      - '127.0.0.1:8000:8000'

volumes:
  mcp-data:
