# FULL UI e2e stack — TEST ONLY. Brings up the fake Google IdP emulator,
# an isolated Wiki.js, the MCP server, and a Playwright runner that drives
# the browser OAuth+consent flow under different roles.
#
# Run it in stages (seed is a one-shot, so no --abort-on-container-exit):
#   C=deploy/docker-compose.e2e.yml
#   docker compose -f $C build mcp
#   docker compose -f $C up -d --wait db wiki idp
#   docker compose -f $C run --rm seed
#   docker compose -f $C up -d --wait mcp
#   docker compose -f $C run --rm playwright     # exit code = test result
#   docker compose -f $C down -v
#
# Host networking is used so the browser and every server share one
# address space (localhost:PORT), which sidesteps OAuth redirect
# host-mismatch problems. Linux-only (matches CI runners).

name: wikijs-mcp-e2e

services:
  db:
    image: postgres:15-alpine
    network_mode: host
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: wikijsrocks
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wikijs -d wiki']
      interval: 5s
      timeout: 3s
      retries: 30

  wiki:
    image: ghcr.io/requarks/wiki:2.5.303
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: wikijsrocks
      DB_NAME: wiki
    volumes:
      - ../packages/wikijs-auth-module:/wiki/server/modules/authentication/mcpdelegation:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60

  idp:
    image: node:22-alpine
    network_mode: host
    working_dir: /app
    command: node packages/e2e-ui/idp/server.mjs
    environment:
      PORT: 9000
      ISSUER: http://localhost:9000
      CLIENT_ID: fake-google-client
      CLIENT_SECRET: fake-google-secret
    volumes:
      - ..:/app
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9000/healthz']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: finalize the Wiki.js DB, seed ACL fixtures, generate the MCP
  # keypair into the shared volume, and register the delegation strategy.
  seed:
    image: node:22-alpine
    network_mode: host
    working_dir: /app
    depends_on:
      wiki:
        condition: service_healthy
    environment:
      WIKI_URL: http://localhost:3000
      MCP_KEYS_DIR: /keys
    command: sh -c "node deploy/seed/seed.mjs && chmod 644 /keys/mcp-assertion-key.pem"
    volumes:
      - ..:/app
      - keys:/keys
    restart: 'no'

  mcp:
    image: wikijs-mcp-server:e2e
    build:
      context: ..
      dockerfile: packages/mcp-server/Dockerfile
    network_mode: host
    depends_on:
      seed:
        condition: service_completed_successfully
      idp:
        condition: service_healthy
    environment:
      PORT: 8000
      PUBLIC_URL: http://localhost:8000
      WIKIJS_URL: http://localhost:3000
      WIKIJS_STRATEGY_KEY: mcpdelegation
      MCP_ASSERTION_PRIVATE_KEY_FILE: /keys/mcp-assertion-key.pem
      GOOGLE_CLIENT_ID: fake-google-client
      GOOGLE_CLIENT_SECRET: fake-google-secret
      GOOGLE_ALLOWED_DOMAIN: example.com
      GOOGLE_AUTHORIZATION_ENDPOINT: http://localhost:9000/authorize
      GOOGLE_TOKEN_ENDPOINT: http://localhost:9000/token
      GOOGLE_JWKS_URI: http://localhost:9000/jwks
      GOOGLE_ISSUER: http://localhost:9000
    volumes:
      - keys:/keys:ro

  playwright:
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    network_mode: host
    working_dir: /app/packages/e2e-ui
    depends_on:
      mcp:
        condition: service_healthy
    environment:
      MCP_URL: http://localhost:8000
      IDP_URL: http://localhost:9000
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      CI: '1'
    command: sh -c "npx playwright test"
    volumes:
      - ..:/app

volumes:
  keys:
