# FULL UI e2e stack — TEST ONLY. Brings up the fake Google IdP emulator,
# an isolated Wiki.js, the MCP server, and a Playwright runner that drives
# the browser OAuth+consent flow under different roles.
#
# Run it in stages (seed is a one-shot, so no --abort-on-container-exit):
#   C=deploy/docker-compose.e2e.yml
#   docker compose -f $C build mcp
#   docker compose -f $C up -d --wait db wiki idp
#   docker compose -f $C run --rm seed
#   docker compose -f $C up -d --wait mcp
#   docker compose -f $C run --rm playwright     # exit code = test result
#   docker compose -f $C down -v
#
# Everything runs on one bridge network and addresses peers by SERVICE
# NAME (mcp:8000, idp:9000, wiki:3000). The Playwright browser runs inside
# the playwright container on that same network, so it resolves the same
# names the servers issue in OAuth redirects — no host-networking needed.

name: wikijs-mcp-e2e

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: wikijsrocks
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wikijs -d wiki']
      interval: 5s
      timeout: 3s
      retries: 30

  wiki:
    image: ghcr.io/requarks/wiki:2.5.303
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: wikijsrocks
      DB_NAME: wiki
    volumes:
      - ../packages/wikijs-auth-module:/wiki/server/modules/authentication/mcpdelegation:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  idp:
    image: node:22-alpine
    working_dir: /app
    command: node packages/e2e-ui/idp/server.mjs
    depends_on:
      # jose/express resolve from the bind-mounted root node_modules.
      db:
        condition: service_started
    environment:
      PORT: 9000
      ISSUER: http://idp:9000
      CLIENT_ID: fake-google-client
      CLIENT_SECRET: fake-google-secret
    volumes:
      - ..:/app
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9000/healthz']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: finalize the Wiki.js DB, seed ACL fixtures, generate the MCP
  # keypair into the shared volume, and register the delegation strategy.
  seed:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      wiki:
        condition: service_healthy
    environment:
      WIKI_URL: http://wiki:3000
      MCP_KEYS_DIR: /keys
    command: sh -c "node deploy/seed/run.mjs && chmod 644 /keys/mcp-assertion-key.pem"
    volumes:
      - ..:/app
      - keys:/keys
    restart: 'no'

  mcp:
    image: wikijs-mcp-server:e2e
    build:
      context: ..
      dockerfile: packages/mcp-server/Dockerfile
    depends_on:
      seed:
        condition: service_completed_successfully
      idp:
        condition: service_healthy
    environment:
      PORT: 8000
      PUBLIC_URL: http://mcp:8000
      # Plain HTTP over a docker service name in the e2e network — the MCP
      # SDK otherwise requires an HTTPS (or localhost) issuer. TEST ONLY;
      # production runs behind HTTPS and never sets this.
      MCP_DANGEROUSLY_ALLOW_INSECURE_ISSUER_URL: '1'
      WIKIJS_URL: http://wiki:3000
      WIKIJS_STRATEGY_KEY: mcpdelegation
      MCP_ASSERTION_PRIVATE_KEY_FILE: /keys/mcp-assertion-key.pem
      GOOGLE_CLIENT_ID: fake-google-client
      GOOGLE_CLIENT_SECRET: fake-google-secret
      GOOGLE_ALLOWED_DOMAIN: example.com
      GOOGLE_AUTHORIZATION_ENDPOINT: http://idp:9000/authorize
      GOOGLE_TOKEN_ENDPOINT: http://idp:9000/token
      GOOGLE_JWKS_URI: http://idp:9000/jwks
      GOOGLE_ISSUER: http://idp:9000
    volumes:
      - keys:/keys:ro

  playwright:
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    working_dir: /app/packages/e2e-ui
    depends_on:
      mcp:
        condition: service_healthy
    environment:
      MCP_URL: http://mcp:8000
      IDP_URL: http://idp:9000
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      CI: '1'
    command: sh -c "npx playwright test"
    volumes:
      - ..:/app

volumes:
  keys:
